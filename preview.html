<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Luna poses</title>
  <style>
    body{background:#26232e;color:#eee;font:12px system-ui;margin:0;padding:16px}
    .grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
    .cell{text-align:center}
    .cell div{opacity:.6;margin-top:4px}
    canvas{background:#3b3746;border-radius:6px}
    h3{margin:16px 0 8px;font-weight:600}
  </style></head>
  <body>
    <h3>poses</h3><div class="grid" id="a"></div>
    <h3>coats</h3><div class="grid" id="b"></div>
    <script type="module">
      import { CatRenderer, FUR_ORDER } from "/src/sprite.ts";
      const P = (o) => ({ form:"sit", t:400, eyes:"open", mouth:"smile", squash:0, lean:0, ...o });
      async function cell(box, label, pose, fur, zoom, facing = 1){
        const wrap=document.createElement("div"); wrap.className="cell";
        const c=document.createElement("canvas"); wrap.appendChild(c);
        const cap=document.createElement("div"); cap.textContent=label; wrap.appendChild(cap);
        box.appendChild(wrap);
        const r=new CatRenderer(c); await r.load(); r.setZoom(zoom); r.draw(pose, fur, facing);
      }
      const forms=["sit","walk","run","sleep","fall","hang","climb","stretch","cheer","sad","eat","groom","watch"];
      for(const f of forms) await cell(a, f, P({form:f, t:420}), "midnight", 3);
      await cell(a, "walk frame 2", P({form:"walk", t:600}), "midnight", 3);
      await cell(a, "walk left", P({form:"walk", t:420}), "midnight", 3, -1);
      await cell(a, "landing squash", P({squash:-0.8}), "midnight", 3);
      for(const f of FUR_ORDER) await cell(b, f, P({}), f, 3);
    </script>
  </body>
</html>
