<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
  <!-- ear tips -->
  <rect x="3" y="0" width="2" height="1" fill="#3f4147"/>
  <rect x="11" y="0" width="2" height="1" fill="#3f4147"/>
  <!-- inner ears -->
  <rect x="2" y="1" width="4" height="1" fill="#f2a6b8"/>
  <rect x="10" y="1" width="4" height="1" fill="#f2a6b8"/>
  <!-- head -->
  <rect x="2" y="2" width="13" height="1" fill="#3f4147"/>
  <rect x="1" y="3" width="14" height="1" fill="#3f4147"/>
  <rect x="1" y="4" width="14" height="1" fill="#3f4147"/>
  <rect x="1" y="5" width="14" height="1" fill="#3f4147"/>
  <rect x="1" y="6" width="4" height="2" fill="#3f4147"/>
  <rect x="7" y="6" width="2" height="2" fill="#3f4147"/>
  <rect x="11" y="6" width="4" height="2" fill="#3f4147"/>
  <!-- eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#fdf6ee"/>
  <rect x="9" y="6" width="2" height="2" fill="#fdf6ee"/>
  <rect x="1" y="8" width="14" height="1" fill="#3f4147"/>
  <!-- nose -->
  <rect x="1" y="9" width="6" height="1" fill="#3f4147"/>
  <rect x="7" y="9" width="2" height="1" fill="#f2a6b8"/>
  <rect x="9" y="9" width="6" height="1" fill="#3f4147"/>
  <rect x="1" y="10" width="14" height="1" fill="#3f4147"/>
  <!-- body -->
  <rect x="2" y="11" width="13" height="1" fill="#3f4147"/>
  <rect x="2" y="12" width="11" height="1" fill="#3f4147"/>
  <!-- collar -->
  <rect x="2" y="13" width="3" height="1" fill="#3f4147"/>
  <rect x="5" y="13" width="4" height="1" fill="#0f766e"/>
  <rect x="9" y="13" width="3" height="1" fill="#3f4147"/>
  <rect x="2" y="14" width="6" height="1" fill="#3f4147"/>
</svg>
