name: "Build desktop app"

on:
  workflow_dispatch: # run manually and download installers from the Artifacts tab
  push:
    tags:
      - "v*" # or push a tag like v0.1.0 to get a draft release with installers

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            name: "macos-apple-silicon"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            name: "macos-intel"
          - platform: "ubuntu-22.04"
            args: ""
            name: "linux"
          # Windows: build only the NSIS .exe installer. The default also builds
          # an .msi, which downloads the WiX toolset mid-build and often fails
          # on GitHub runners.
          - platform: "windows-latest"
            args: "--bundles nsis"
            name: "windows"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Code Companion-luna v__VERSION__"
          releaseBody: "Desktop pet installers for Windows, macOS, and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Always upload the installers as artifacts so they can be downloaded
      # straight from the run page, even without a tagged release.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: luna-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
