name: Build Luna

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macOS (Intel)
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      # Builds the app *and*, via beforeBuildCommand, the `luna` CLI sidecar.
      - name: Build Luna
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$base" -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} out/ \;
          # The CLI is useful on its own, so ship it next to the installers.
          cp "src-tauri/binaries/luna-${{ matrix.target }}"* out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: luna-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Luna, a featherweight desktop cat.

            Grab the installer for your platform. The `luna` CLI is installed
            beside the app - point your shell at it and run
            `luna watch "npm run build"` to make her build-aware.
