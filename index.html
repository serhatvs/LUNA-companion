<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna</title>
  </head>
  <body>
    <!-- The whole desktop is the stage. Everything in it is pointer-transparent
         except Luna herself and any panel she opens. No full-screen canvas:
         each actor is its own tiny composited layer. -->
    <div id="stage">
      <div id="luna" class="actor">
        <canvas id="cat"></canvas>
      </div>
      <div id="bubble" class="hidden"></div>
      <div id="timer" class="hidden"></div>
      <div id="panel" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
