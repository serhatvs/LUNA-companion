[package]
name = "code-companion-luna"
version = "0.1.0"
description = "Code Companion · Luna — a featherweight desktop pet for your builds"
authors = ["your team"]
edition = "2021"

[lib]
name = "code_companion_luna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
