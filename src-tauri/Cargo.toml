[package]
name = "luna-companion"
version = "0.2.0"
description = "Luna - a featherweight desktop cat that waits for your builds"
authors = ["sehatvs"]
edition = "2021"
# The package ships two binaries; the app is the one `cargo run` means.
default-run = "luna-companion"
rust-version = "1.77.2"

[lib]
name = "luna_lib"
# Desktop only, so no cdylib/staticlib mobile targets.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
