[package]
name = "code-companion-luna"
version = "0.1.0"
description = "A featherweight coding companion that lives on your desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "code_companion_luna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
